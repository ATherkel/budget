[project]
name = "budget"
version = "0.1.0"
description = "Self-hostable household budget platform built on a Bronze/Silver/Gold data pipeline."
readme = "README.md"
authors = [
    { name = "Therkel", email = "antherkelsen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
budget = "budget.cli:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "complexipy>=4",
    "pytest>=8",
    "ruff>=0.13",
    "ty>=0.0.1a20",
]

[tool.uv]
# ADR-013: a system Python's SQLite can be below the store's version floor, so
# use only uv's managed builds.
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter; see
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812",
    "ISC001",
    # Mutually exclusive pairs; keep D203 and D213 off in favour of D211 and D212.
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Owner-approved throwaway scripts retain their non-package launch paths.
# INP001: standalone prototype scripts, deliberately not an importable package.
# CPY001: no copyright notice is invented; licensing is unchanged.
"prototypes/dashboard-11/serve.py" = ["INP001", "CPY001"]
"prototypes/dashboard-11/build_example.py" = ["INP001", "CPY001"]
"prototypes/dashboard-11/check_fixtures.py" = ["INP001", "CPY001"]
"tests/**" = [
    "S101",    # pytest uses bare `assert`
    "D",       # test names document the behaviour
    "PLR2004", # expected values are literal by design
    "S603",    # tests start sys.executable with arguments they build
]

[tool.ruff.lint.mccabe]
# SonarQube's cognitive-complexity limit is 15 (rule python:S3776); keep
# cyclomatic complexity under the same ceiling.
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
# Promote every ty warning to an error so the gate cannot pass with warnings.
all = "error"

[tool.complexipy]
# Mirrors SonarQube python:S3776 (cognitive complexity per function <= 15).
max-complexity-allowed = 15
paths = ["."]
exclude = [".venv"]
