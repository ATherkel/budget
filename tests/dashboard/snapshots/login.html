<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17665a">
<title>Log ind · Budget</title>
<link rel="stylesheet" href="/static/app.css?v=<digest>">

</head>
<body>
<a class="skip-link" href="#main-content">Spring til indhold</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="Budget, gå til nyeste oversigt">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span>Budget</span>
    </a>
    <nav class="header-actions" aria-label="Sidehandlinger">
      
<span class="header-note">Beskyttet adgang</span>

    </nav>
  </div>
</header>
<main class="shell page" id="main-content" >
  
<section class="login-layout" aria-labelledby="login-heading">
  <div class="login-intro">
    <p class="eyebrow">Privat oversigt</p>
    <h1 id="login-heading">Log ind</h1>
    <p class="lede">Brug husstandens adgangskode for at åbne budgettet.</p>
  </div>
  <div class="login-panel">
    
    <form method="post" action="/login" class="stack">
      <label for="passphrase">Adgangskode</label>
      <input id="passphrase" type="password" name="passphrase" autocomplete="current-password" autofocus required>
      <button class="button" type="submit">Log ind</button>
    </form>
  </div>
</section>

</main>
<footer class="site-footer">
  <div class="shell footer-inner">
    <span>Lokale husstandsdata</span>
    <span>Beskyttet adgang</span>
  </div>
</footer>

</body>
</html>
