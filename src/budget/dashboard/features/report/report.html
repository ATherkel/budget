<section id="report" class="report-content" data-publication="{{ publication_id }}"
  data-reference-date="{{ reference_date }}" data-accounts="{{ accounts }}" data-month="{{ month }}"
  data-mode="{{ mode }}" data-tab="{{ tab }}" aria-labelledby="report-ready-title">
{% for notice in notices %}
{% include notice.template %}
{% endfor %}
{# The route picks the tab's template. #}
{% include tab_template %}
</section>
