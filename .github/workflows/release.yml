name: Release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the release manifest freezes every migration
        run: RELEASE_TAG="v$(uv version --short)" uv run pytest -m release
      - name: Tag and release the pyproject version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(uv version --short)" --target "$GITHUB_SHA" --generate-notes
