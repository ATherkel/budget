name: Pytest

# Runs the test suite with pytest, which also collects unittest-style
# `TestCase` classes, so one runner covers both. Kept apart from the static
# gate in quality.yml because later jobs here (a package build, for example)
# will depend on the tests passing through `needs: pytest`, and `needs:` only
# reaches jobs in the same workflow. Make `pytest` a required status check on
# `main`. The job always runs, so every PR reports the check and never waits
# on a check that cannot start.
#
# A docs-only pull request (every changed path under docs/ or ending in .md)
# runs only `pytest -m docs`: the tests that read docs/ or README.md, which
# tests/conftest.py marks by module. Every other PR, and every push to main,
# runs the full suite.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-only change
        id: changes
        # --no-renames lists a moved file under both paths, so moving code
        # into docs/ is not mistaken for a docs-only change. An empty diff
        # counts as not docs-only.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only --no-renames "$BASE_SHA"...HEAD)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run tests
        # pytest exits 5 when it collects no tests. Accept that only while the
        # repository has no tests/ directory; once tests exist, collecting
        # none is a failure.
        env:
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
        run: |
          status=0
          if [ "$DOCS_ONLY" = true ]; then
            echo "::notice::Docs-only change; running only the docs-marked tests."
            uv run pytest -m docs || status=$?
          else
            uv run pytest || status=$?
          fi
          if [ "$status" -eq 5 ] && [ ! -d tests ]; then
            echo "::notice::No tests/ directory yet; nothing to run."
            exit 0
          fi
          exit "$status"
