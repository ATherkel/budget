# Install with `uvx pre-commit install`. The hook runs the djlint version
# locked in uv.lock, with the settings in pyproject.toml and .djlint_rules.yaml.
repos:
  - repo: local
    hooks:
      - id: djlint
        name: djlint (lint templates)
        entry: uv run djlint --lint
        language: system
        files: ^src/.*\.html$
      - id: css-duplicates
        name: duplicate CSS rules
        entry: uv run pytest tests/test_css_duplicates.py -q
        language: system
        files: (\.css|css-duplicates-allowlist\.txt|css_duplicates\.py)$
        pass_filenames: false
